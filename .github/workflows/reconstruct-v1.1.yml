name: Reconstruct PAG v1.1

on:
  push:
    branches:
      - feat/v1.1-connections-access
    paths:
      - .payload/READY

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated workspace
        shell: bash
        run: |
          cat .payload/part-*.b64 | base64 --decode > /tmp/pag-v1.1.tar.xz
          echo "7848de2ee5bc5314005488552bb1a943860cb39d523f504c8e46ea16fc6afe1c  /tmp/pag-v1.1.tar.xz" | sha256sum -c -
          tar -xJf /tmp/pag-v1.1.tar.xz -C .
          rm -rf .payload
          rm -f .github/workflows/reconstruct-v1.1.yml

      - name: Verify reconstructed source
        shell: bash
        run: |
          find bin src tests examples public -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check
          bash -n docker-entrypoint.sh
          npm test

      - name: Commit reconstructed v1.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add connections and access management"
          git push origin HEAD:feat/v1.1-connections-access
